name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pages CMS commits to main, so a content edit triggers the push above and
  # redeploys on its own. This entry is just an escape hatch.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, but let a newer commit finish rather than
# cancelling it — a content edit landing mid-deploy should win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --strict is the difference between this and a local build: placeholder
      # text in a published entry fails here rather than reaching the live site.
      - run: npm run build:strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
